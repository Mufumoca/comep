[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comep"
version = "0.1.0"
description = "Combinatorial credit assignment and synergy-aware memory pruning research prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3", "transformers>=4.40"]
tokens = ["tiktoken>=0.7"]
plots = ["matplotlib>=3.8"]

[project.scripts]
comep = "comep.cli:main"

[tool.setuptools.packages.find]
include = ["comep*"]
