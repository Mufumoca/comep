[environment]
name = "scienceworld"
tasks_path = "external/scienceworld_tasks.json"

[api]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
key_env = "DEEPSEEK_API_KEY"
thinking = "disabled"
max_calls = 100
max_total_tokens = 100000
max_output_tokens = 128

[agent]
episodes = 2
max_steps = 50
history_turns = 6
distill = true
seed = 0

[memory]
method = "comep"

[manager]
retrieval_tokens = 120
bank_tokens = 600
max_items = 5
max_bank_items = 50
